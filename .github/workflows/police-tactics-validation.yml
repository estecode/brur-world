name: Police tactics validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/police_tactic_*.gd'
      - 'scripts/police_spike_strip_tactic.gd'
      - 'tests/godot/test_police_tactics.gd'
      - '.github/workflows/police-tactics-validation.yml'

jobs:
  police-tactics-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4 headless runtime
        run: |
          curl -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "GODOT_BIN=/tmp/godot/Godot_v4.5.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run police tactics regressions headlessly
        run: |
          timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_police_tactics.gd
