name: Police foot search validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/police_last_known_target_state.gd'
      - 'scripts/police_foot_search_area.gd'
      - 'scripts/police_foot_search_task.gd'
      - 'scripts/police_officer_foot_ai.gd'
      - 'scripts/police_officer_person_controller.gd'
      - 'scripts/police_observation_store.gd'
      - 'tests/godot/test_police_foot_search.gd'
      - '.github/workflows/police-foot-search-validation.yml'

jobs:
  police-foot-search-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4 headless runtime
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "GODOT_BIN=/tmp/godot/Godot_v4.5.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run police foot pursuit and search regressions headlessly
        run: |
          timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_police_foot_search.gd
      - name: Run police vehicle pursuit regressions headlessly
        run: |
          timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_police_pursuit.gd
