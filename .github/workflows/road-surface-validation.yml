name: Road surface validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/build_roads.py"
      - "tools/road_surface_mesh.py"
      - "scripts/main.gd"
      - "tests/test_road_surface_mesh.py"
      - "tests/test_road_surface_split_way.py"
      - "tests/godot/test_road_surface_mesh_runtime.gd"
      - ".github/workflows/road-surface-validation.yml"

permissions:
  contents: read

jobs:
  road-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run deterministic road-surface geometry tests
        run: python -m unittest tests.test_road_surface_mesh tests.test_road_surface_split_way tests.test_build_roads_lod

      - name: Install Godot 4 headless runtime
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.5.1-stable"
          GODOT_ZIP="$RUNNER_TEMP/godot.zip"
          GODOT_DIR="$RUNNER_TEMP/godot"
          mkdir -p "$GODOT_DIR"
          curl -fsSL \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            -o "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT_BIN="$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Verify BRS1 production runtime decoder
        run: timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_road_surface_mesh_runtime.gd
