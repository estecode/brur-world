name: Traffic validation

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/traffic_*.gd"
      - "tests/godot/test_traffic_simulation.gd"
      - ".github/workflows/traffic-validation.yml"

permissions:
  contents: read

jobs:
  traffic-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4 headless runtime
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.5.1-stable"
          GODOT_ZIP="$RUNNER_TEMP/godot.zip"
          GODOT_DIR="$RUNNER_TEMP/godot"
          mkdir -p "$GODOT_DIR"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          chmod +x "$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run lightweight traffic regression tests headlessly
        run: timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_traffic_simulation.gd
