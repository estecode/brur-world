name: GeoDot POC validation
on:
  push:
    branches: [issue/342-geodot-poc]
  pull_request:
    branches: [main]
    paths: ['scripts/geodot_**','scenes/geodot_poc.tscn','tests/godot/test_geodot_**','tests/test_geodot_far_cache.py','tools/check_geodot_gpkg.py','tools/build_geodot_far_cache.py','tools/setup_geodot_poc.sh','.github/workflows/geodot-poc-validation.yml']
permissions: {contents: read}
jobs:
  geodot-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_geodot_far_cache.py
      - name: Install Godot
        run: |
          set -euo pipefail; V=4.5.1-stable; Z="$RUNNER_TEMP/godot.zip"; D="$RUNNER_TEMP/godot"; mkdir -p "$D"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip" -o "$Z"; unzip -q "$Z" -d "$D"
          B="$D/Godot_v${V}_linux.x86_64"; chmod +x "$B"; echo "GODOT_BIN=$B" >> "$GITHUB_ENV"
      - name: Run GeoDot contracts
        run: |
          set -euo pipefail
          for t in test_geodot_hlod_residency.gd test_geodot_runtime_hlod_integration.gd test_geodot_renderer_contracts.gd test_geodot_runtime_bounds.gd test_geodot_lod_policy.gd test_geodot_tuning_contract.gd test_geodot_view_coverage.gd test_geodot_streaming_policy.gd test_geodot_streaming_transition.gd test_geodot_atomic_ownership.gd test_geodot_photo_zoom_contract.gd test_geodot_cell_geometry.gd test_geodot_lod_continuity.gd test_geodot_composition_contract.gd test_geodot_failure_contract.gd; do timeout 20s "$GODOT_BIN" --headless --path . --script "tests/godot/$t"; done
  macos-render-lifecycle:
    runs-on: macos-14
    timeout-minutes: 15
    strategy: {fail-fast: false, matrix: {godot: ['4.6.3-stable','4.7.2-stable']}}
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Godot macOS runtime
        run: |
          set -euo pipefail; V="${{ matrix.godot }}"; Z="$RUNNER_TEMP/godot.zip"; curl -fsSL "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_macos.universal.zip" -o "$Z"; ditto -x -k "$Z" "$RUNNER_TEMP/godot"; B="$(find "$RUNNER_TEMP/godot" -path '*/Godot.app/Contents/MacOS/Godot' -type f | head -1)"; chmod +x "$B"; echo "GODOT_BIN=$B" >> "$GITHUB_ENV"
      - run: "$GODOT_BIN" --headless --path . --script tests/godot/test_geodot_hlod_residency.gd
      - run: "$GODOT_BIN" --headless --path . --script tests/godot/test_geodot_runtime_hlod_integration.gd
      - run: "$GODOT_BIN" --headless --path . --script tests/godot/test_geodot_photo_zoom_contract.gd
      - run: "$GODOT_BIN" --headless --path . --script tests/godot/test_geodot_renderer_contracts.gd
  macos-native-geodot-lifecycle:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: boku-ilen/geodot-plugin, ref: 9999e5976f9efd75d5f756e008dfe6bbac6e6f71, path: geodot-upstream, submodules: recursive}
      - name: Build Apple Silicon GeoDot bundle
        run: |
          set -euo pipefail; brew install gdal scons; find geodot-upstream -name '*.dylib' -delete
          (cd geodot-upstream/godot-cpp && scons -j3 platform=macos use_hot_reload=yes arch=arm64 generate_bindings=yes)
          (cd geodot-upstream && scons -j3 platform=macos arch=arm64 osgeo_path="$(brew --prefix gdal)")
          P="geodot-upstream/demo/addons/geodot/macos"; G="$(brew --prefix gdal)/lib/libgdal.38.dylib"; cp "$G" "$P/libgdal.38.dylib"; install_name_tool -change @rpath/libgdal.38.dylib @loader_path/libgdal.38.dylib "$P/libgeodot.dylib" || true; rm -rf addons/geodot; mkdir -p addons; cp -R geodot-upstream/demo/addons/geodot addons/geodot
      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail; V=4.7.2-stable; Z="$RUNNER_TEMP/godot.zip"; curl -fsSL "https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_macos.universal.zip" -o "$Z"; ditto -x -k "$Z" "$RUNNER_TEMP/godot"; B="$(find "$RUNNER_TEMP/godot" -path '*/Godot.app/Contents/MacOS/Godot' -type f | head -1)"; chmod +x "$B"; echo "GODOT_BIN=$B" >> "$GITHUB_ENV"
      - name: Prove native extension plus GeoPackage exits cleanly
        env: {BRUR_GEODOT_GPKG: '${{ github.workspace }}/geodot-upstream/demo/geodata/geopackage_sample.gpkg'}
        run: "$GODOT_BIN" --headless --path . --script tests/godot/test_geodot_native_lifecycle.gd
