name: GeoDot POC validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/geodot_**'
      - 'scenes/geodot_poc.tscn'
      - 'tests/godot/test_geodot_**'
      - 'tests/test_geodot_far_cache.py'
      - 'tools/check_geodot_gpkg.py'
      - 'tools/build_geodot_far_cache.py'
      - 'tools/setup_geodot_poc.sh'
      - '.github/workflows/geodot-poc-validation.yml'
permissions: {contents: read}
jobs:
  geodot-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate deterministic far cache builder
        run: python3 tests/test_geodot_far_cache.py
      - name: Install Godot 4 headless runtime
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.5.1-stable"
          GODOT_ZIP="$RUNNER_TEMP/godot.zip"; GODOT_DIR="$RUNNER_TEMP/godot"; mkdir -p "$GODOT_DIR"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT_BIN="$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64"; chmod +x "$GODOT_BIN"; echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
      - name: Run GeoDot renderer contracts
        run: |
          set -euo pipefail
          for test in \
            test_geodot_renderer_contracts.gd test_geodot_runtime_bounds.gd test_geodot_lod_policy.gd \
            test_geodot_tuning_contract.gd test_geodot_view_coverage.gd test_geodot_streaming_policy.gd \
            test_geodot_streaming_transition.gd test_geodot_atomic_ownership.gd test_geodot_cell_geometry.gd test_geodot_lod_continuity.gd \
            test_geodot_composition_contract.gd test_geodot_failure_contract.gd; do
            timeout 20s "$GODOT_BIN" --headless --path . --script "tests/godot/$test"
          done

  macos-render-lifecycle:
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        godot: ['4.6.3-stable', '4.7.2-stable']
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Godot macOS runtime
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ matrix.godot }}"
          ZIP="$RUNNER_TEMP/godot.zip"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_macos.universal.zip" -o "$ZIP"
          ditto -x -k "$ZIP" "$RUNNER_TEMP/godot"
          BIN="$(find "$RUNNER_TEMP/godot" -path '*/Godot.app/Contents/MacOS/Godot' -type f | head -1)"
          test -n "$BIN"; chmod +x "$BIN"; echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Prove pure ownership process exits cleanly
        run: "$GODOT_BIN" --headless --path . --script tests/godot/test_geodot_atomic_ownership.gd
      - name: Prove mesh/resource contract process exits cleanly
        run: "$GODOT_BIN" --headless --path . --script tests/godot/test_geodot_renderer_contracts.gd

  macos-native-geodot-lifecycle:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: boku-ilen/geodot-plugin
          path: geodot-upstream
          submodules: recursive
      - name: Build current Apple Silicon GeoDot bundle
        shell: bash
        run: |
          set -euo pipefail
          brew install gdal scons dylibbundler
          (cd geodot-upstream/godot-cpp && scons platform=macos use_hot_reload=yes arch=arm64 generate_bindings=yes)
          (cd geodot-upstream && scons platform=macos arch=arm64 osgeo_path="$(brew --prefix gdal)")
          dylibbundler -of -b -x geodot-upstream/demo/addons/geodot/macos/libgeodot.dylib -d geodot-upstream/demo/addons/geodot/macos/ -p @loader_path
          rm -rf addons/geodot
          mkdir -p addons
          cp -R geodot-upstream/demo/addons/geodot addons/geodot
          test -f addons/geodot/geodot.gdextension
          test -f geodot-upstream/demo/geodata/geopackage_sample.gpkg
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.7.2-stable"; ZIP="$RUNNER_TEMP/godot.zip"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_macos.universal.zip" -o "$ZIP"
          ditto -x -k "$ZIP" "$RUNNER_TEMP/godot"
          BIN="$(find "$RUNNER_TEMP/godot" -path '*/Godot.app/Contents/MacOS/Godot' -type f | head -1)"
          test -n "$BIN"; chmod +x "$BIN"; echo "GODOT_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Prove native extension plus GeoPackage exits cleanly
        shell: bash
        env:
          BRUR_GEODOT_GPKG: ${{ github.workspace }}/geodot-upstream/demo/geodata/geopackage_sample.gpkg
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script tests/godot/test_geodot_native_lifecycle.gd
