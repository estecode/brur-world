name: GeoDot POC validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/geodot_*.gd'
      - 'scenes/geodot_poc.tscn'
      - 'tests/godot/test_geodot_*.gd'
      - 'tools/setup_geodot_poc.sh'
      - 'tools/check_geodot_gpkg.py'
      - '.github/workflows/geodot-poc-validation.yml'

permissions:
  contents: read

jobs:
  geodot-poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin scons unzip

      - name: Install Godot 4 headless runtime
        run: |
          set -euo pipefail
          GODOT_VERSION="4.5.1-stable"
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Run plugin-independent renderer contracts
        run: timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_geodot_renderer_contracts.gd

      - name: Parse real-data performance harness
        run: BRUR_PARSE_ONLY=1 timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_geodot_fps_real_data.gd

      - name: Install pinned GeoDot addon
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/setup_geodot_poc.sh

      - name: Build synthetic EPSG:3006 GeoPackage fixture
        run: |
          mkdir -p "$RUNNER_TEMP/geodot-fixture"
          cat > "$RUNNER_TEMP/geodot-fixture/buildings.geojson" <<'JSON'
          {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"building":"yes","building:levels":"4"},"geometry":{"type":"Polygon","coordinates":[[[500,500],[550,500],[550,540],[500,540],[500,500]]]}}]}
          JSON
          cat > "$RUNNER_TEMP/geodot-fixture/roads.geojson" <<'JSON'
          {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"highway":"primary"},"geometry":{"type":"LineString","coordinates":[[400,450],[800,900]]}}]}
          JSON
          ogr2ogr -f GPKG "$RUNNER_TEMP/geodot-fixture/fixture.gpkg" "$RUNNER_TEMP/geodot-fixture/buildings.geojson" -nln buildings -a_srs EPSG:3006
          ogr2ogr -f GPKG -append "$RUNNER_TEMP/geodot-fixture/fixture.gpkg" "$RUNNER_TEMP/geodot-fixture/roads.geojson" -nln roads -a_srs EPSG:3006
          echo "BRUR_GEODOT_GPKG=$RUNNER_TEMP/geodot-fixture/fixture.gpkg" >> "$GITHUB_ENV"

      - name: Inspect GeoPackage schema and spatial indexes
        run: python3 tools/check_geodot_gpkg.py "$BRUR_GEODOT_GPKG"

      - name: Run native GeoDot fixture integration
        run: timeout 30s "$GODOT_BIN" --headless --path . --script tests/godot/test_geodot_plugin_fixture.gd

      - name: Parse normal BRUR GeoDot POC scene
        run: BRUR_GEODOT_GPKG="$BRUR_GEODOT_GPKG" timeout 30s "$GODOT_BIN" --headless --path . scenes/geodot_poc.tscn --quit-after 2

  geodot-poc-apple-silicon:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          echo "GEODOT_MAC_ARCH=$(uname -m)"

      - name: Install dependencies
        run: brew install gdal scons dylibbundler

      - name: Install Godot 4.5.1 universal runtime
        run: |
          set -euo pipefail
          GODOT_VERSION="4.5.1-stable"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          ditto -x -k "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/godot"
          GODOT_BIN="$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          test -x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install pinned GeoDot addon for arm64
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/setup_geodot_poc.sh

      - name: Build synthetic EPSG:3006 GeoPackage fixture
        run: |
          mkdir -p "$RUNNER_TEMP/geodot-fixture"
          cat > "$RUNNER_TEMP/geodot-fixture/buildings.geojson" <<'JSON'
          {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"building":"yes","building:levels":"4"},"geometry":{"type":"Polygon","coordinates":[[[500,500],[550,500],[550,540],[500,540],[500,500]]]}}]}
          JSON
          cat > "$RUNNER_TEMP/geodot-fixture/roads.geojson" <<'JSON'
          {"type":"FeatureCollection","features":[{"type":"Feature","properties":{"highway":"primary"},"geometry":{"type":"LineString","coordinates":[[400,450],[800,900]]}}]}
          JSON
          ogr2ogr -f GPKG "$RUNNER_TEMP/geodot-fixture/fixture.gpkg" "$RUNNER_TEMP/geodot-fixture/buildings.geojson" -nln buildings -a_srs EPSG:3006
          ogr2ogr -f GPKG -append "$RUNNER_TEMP/geodot-fixture/fixture.gpkg" "$RUNNER_TEMP/geodot-fixture/roads.geojson" -nln roads -a_srs EPSG:3006
          echo "BRUR_GEODOT_GPKG=$RUNNER_TEMP/geodot-fixture/fixture.gpkg" >> "$GITHUB_ENV"

      - name: Inspect GeoPackage schema and spatial indexes
        run: python3 tools/check_geodot_gpkg.py "$BRUR_GEODOT_GPKG"

      - name: Run native GeoDot fixture integration on arm64
        run: "$GODOT_BIN" --headless --path . --script tests/godot/test_geodot_plugin_fixture.gd
