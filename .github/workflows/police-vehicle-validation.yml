name: Police vehicle validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/vehicle.gd"
      - "scripts/police_vehicle_visual.gd"
      - "scenes/vehicle.tscn"
      - "tests/godot/test_police_vehicle.gd"
      - "docs/research/swedish_police_vehicle_profile.md"
      - ".github/workflows/police-vehicle-validation.yml"

permissions:
  contents: read

jobs:
  headless-police-vehicle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4 headless runtime
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.5.1-stable"
          GODOT_ZIP="$RUNNER_TEMP/godot.zip"
          GODOT_DIR="$RUNNER_TEMP/godot"
          mkdir -p "$GODOT_DIR"
          curl -fsSL \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            -o "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT_BIN="$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Run Swedish police vehicle regression
        run: timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_police_vehicle.gd
