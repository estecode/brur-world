name: GeoDot POC Apple Silicon validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/geodot-poc-apple-silicon.yml'

permissions:
  contents: read

jobs:
  geodot-poc-apple-silicon:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          uname -a
