name: PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  objective-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Guard production startup scene
        run: python -m unittest tests.test_project_entrypoint

      - name: Run OSM source cache tests
        run: |
          python -m unittest tests.test_osm_source_cache
          python -m unittest tests.test_osm_source_cache_resume
          python -m unittest tests.test_osm_finalize_progress
          python -m unittest tests.test_osm_route_source

      - name: Run road LOD build policy tests
        run: python -m unittest tests.test_build_roads_lod

      - name: Run traffic signal compiler tests
        run: python -m unittest tests.test_traffic_signals

      - name: Run building tile derivation tests
        run: |
          python -m unittest tests.test_building_tiles
          python -m unittest tests.test_building_runtime_composition
          python -m unittest tests.test_build_sweden_building_tiles

      - name: Run world showcase cache preparation tests
        run: python -m unittest tests.test_world_showcase_prepare

      - name: Run Windows client bundle packaging tests
        run: python -m unittest tests.test_world_showcase_client_package

      - name: Validate reusable Windows build tooling
        run: |
          bash -n tools/windows_build.sh
          bash -n tools/windows_build/build.sh
          bash -n tools/windows_build/target.sh
          python -m unittest tests.test_windows_build_package

      - name: Install Godot 4 headless runtime
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.5.1-stable"
          GODOT_ZIP="$RUNNER_TEMP/godot.zip"
          GODOT_DIR="$RUNNER_TEMP/godot"
          mkdir -p "$GODOT_DIR"
          curl -fsSL \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            -o "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT_BIN="$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Parse driving harness
        run: timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_driving_harness_parse.gd

      - name: Validate playtest launcher
        run: bash tests/test_playtest_launcher.sh

      - name: Validate PR check scope
        run: python tests/test_pr_check_scope.py

      - name: Validate persistent local PR-check status
        run: |
          bash -n tools/pr_check.sh
          python tests/test_pr_check_status.py

      - name: Validate PR-owned local check hook
        run: |
          bash -n tools/run_pr_owned_check.sh
          bash tests/test_pr_owned_check.sh

      - name: Run world streaming foundation tests
        run: |
          timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_world_streaming_foundation.gd

      - name: Run road surface query tests
        run: |
          timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_road_surface_query.gd

      - name: Run continuous world showcase tests
        run: |
          timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_world_showcase.gd

      - name: Run portable vehicle dynamics tests
        run: |
          timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_vehicle_dynamics.gd

      - name: Run vehicle integration tests
        run: |
          timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_vehicle_integration.gd

      - name: Run map controls regression tests
        run: |
          timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_map_controls.gd

      - name: Run POI startup default regression test
        run: |
          timeout 20s "$GODOT_BIN" --headless --path . --script tests/godot/test_poi_default_disabled.gd

      - name: Run objective GPS regression suite
        env:
          CXX: g++
        run: bash tools/test_issue4_gps.sh

      - name: Run objective music playback tests
        run: bash tools/test_music.sh

      - name: Run objective world clock tests
        run: bash tools/test_world_clock.sh

      - name: Run objective camera altitude tests
        run: bash tools/test_camera_altitude.sh

      - name: Run objective astronomical sun tests
        run: bash tools/test_sun.sh

      - name: Run objective city light tests
        run: bash tools/test_city_lights.sh

      - name: Run objective UI overlay tests
        run: bash tools/test_ui_overlays.sh

      - name: Run objective cloud field tests
        run: bash tools/test_clouds.sh
