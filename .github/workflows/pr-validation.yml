name: PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  objective-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Godot 4 headless runtime
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.5.1-stable"
          GODOT_ZIP="$RUNNER_TEMP/godot.zip"
          GODOT_DIR="$RUNNER_TEMP/godot"
          mkdir -p "$GODOT_DIR"
          curl -fsSL \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            -o "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT_BIN="$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Validate playtest launcher
        run: bash tests/test_playtest_launcher.sh

      - name: Run portable vehicle dynamics tests
        run: |
          "$GODOT_BIN" --headless --path . --script tests/godot/test_vehicle_dynamics.gd

      - name: Run vehicle integration tests
        run: |
          "$GODOT_BIN" --headless --path . --script tests/godot/test_vehicle_integration.gd

      - name: Run objective GPS regression suite
        env:
          CXX: g++
        run: bash tools/test_issue4_gps.sh
