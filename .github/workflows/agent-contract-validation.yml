name: Agent contract validation

on:
  pull_request:
    branches:
      - main
    paths:
      - AGENTS.md
      - tests/agent_contract/**
      - .github/workflows/agent-contract-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate agent contract
        run: python tests/agent_contract/test_agent_contract.py
